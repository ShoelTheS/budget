<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B1F" media="(prefers-color-scheme: dark)">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#E9EDE7; --surface:#FFFFFF; --ink:#1B2A33; --muted:#5E6B70; --line:#D5DCD4;
  --pine:#2E6B57; --over:#B43A3A; --fixed:#1B2A33; --reserve:#6C7A80; --free:#CFE0D6;
  --shadow:0 1px 0 rgba(27,42,51,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B1F; --surface:#1D262B; --ink:#E6ECE8; --muted:#97A4A8; --line:#2C373D;
    --pine:#6FBF9F; --over:#E0706A; --fixed:#E6ECE8; --reserve:#7D8B90; --free:#27433A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B1F; --surface:#1D262B; --ink:#E6ECE8; --muted:#97A4A8; --line:#2C373D;
  --pine:#6FBF9F; --over:#E0706A; --fixed:#E6ECE8; --reserve:#7D8B90; --free:#27433A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h2{font-size:1rem;font-weight:650;margin:28px 0 10px}
.hint{color:var(--muted);font-size:.875rem}

/* month header */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.monthbar h1{font-size:1.25rem;font-weight:700;margin:0}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.2rem}

/* hero: the income strip */
.hero{background:var(--surface);border-radius:20px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.hero .label{color:var(--muted);font-size:.9rem}
.hero .big{font-size:2.6rem;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:2px 0 16px}
.hero .big.neg{color:var(--over)}
.strip{display:flex;height:34px;border-radius:8px;overflow:hidden;background:var(--free);gap:2px}
.strip span{display:block;height:100%;min-width:3px;transition:flex-grow .35s ease}
.strip .free{background:var(--free)}
.overflag{margin-top:8px;color:var(--over);font-size:.875rem;font-weight:600}
.legend{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:7px}
.legend li{display:flex;align-items:center;gap:10px;font-size:.93rem}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend li>span:nth-child(2){flex:1;min-width:0}
.legend .amt{margin-left:auto;white-space:nowrap}
.legend .of{color:var(--muted);font-size:.8rem;width:40px;text-align:right}

/* category rows */
.cats{display:grid;gap:14px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.cat .top .num{white-space:nowrap}
.cat .top{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.cat .top b{font-weight:600}
.cat .top .r{color:var(--muted)}
.cat .top .r.bad{color:var(--over);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}

/* lists */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.day{padding:10px 16px 4px;font-size:.8rem;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.row:first-child,.day+.row{border-top:0}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}
.row .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .sub{font-size:.8rem;color:var(--muted)}
.row .a{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.totals{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-weight:650}

/* buttons */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:650;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--over)}
.btn.block{width:100%}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--pine);color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;max-width:190px;border:0;background:none;padding:14px 0 16px;font-size:.9rem;color:var(--muted);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--pine)}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.85rem;color:var(--muted);font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.amount{font-size:2rem;font-weight:700;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:.9rem;display:flex;align-items:center;gap:8px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:11px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--pine)}
.catedit{display:grid;grid-template-columns:14px 1fr 96px 40px;gap:8px;align-items:center;margin-bottom:8px}
.catedit i{width:14px;height:14px;border-radius:4px}
.catedit .input{padding:9px 10px}
.catedit button{height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;max-height:92%;overflow:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:1.15rem}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="view-month"></section>
  <section id="view-fixed" hidden></section>
  <section id="view-settings" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Add expense">+</button>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="month" aria-selected="true">Month</button>
  <button role="tab" data-tab="fixed" aria-selected="false">Fixed costs</button>
  <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
const KEY = 'budget-app-v1';
const COLORS = ['#2E8B6E','#D08A2B','#3F74C2','#9057AE','#C4553A','#3F9A96','#8B8F2E','#B24A78','#5B6BD0','#7A5A3C'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaults(){
  return {
    version:1,
    income:{ monthly:0, thirteenth:false },
    categories:[
      {id:'groc', name:'Groceries & household', budget:0, color:COLORS[0]},
      {id:'trans',name:'Transport', budget:0, color:COLORS[1]},
      {id:'fun',  name:'Going out & hobbies', budget:0, color:COLORS[2]},
      {id:'pers', name:'Clothing & personal', budget:0, color:COLORS[3]},
      {id:'hlth', name:'Health', budget:0, color:COLORS[4]},
      {id:'oth',  name:'Other', budget:0, color:COLORS[5]}
    ],
    fixed:[],
    expenses:[]
  };
}

let S;
try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); } catch(e){ S = defaults(); }
if(!S || !Array.isArray(S.expenses)) S = defaults();

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Couldn’t save — storage is full or blocked'); }
}

/* helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('de-CH',{maximumFractionDigits:0});
const chf = n => 'CHF ' + nf.format(n);
const chf0 = n => 'CHF ' + nf0.format(Math.round(n));
const parseAmt = v => { const n = parseFloat(String(v).replace(/[’'\s]/g,'').replace(',','.')); return isFinite(n) ? Math.round(n*100)/100 : NaN; };
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const catById = id => S.categories.find(c=>c.id===id) || {id:'?',name:'Uncategorised',color:'#888',budget:0};

let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
const monthKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const monthName = d => d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});

function totals(){
  const m = S.fixed.filter(f=>f.freq==='m').reduce((a,f)=>a+f.amount,0);
  const y = S.fixed.filter(f=>f.freq==='y').reduce((a,f)=>a+f.amount,0);
  return {m, y, reserve:y/12};
}

/* ---------- Month view ---------- */
function renderMonth(){
  const key = monthKey(cur);
  const exp = S.expenses.filter(e=>e.date.slice(0,7)===key).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const t = totals();
  const income = S.income.monthly;
  const byCat = {};
  exp.forEach(e => byCat[e.cat] = (byCat[e.cat]||0) + e.amount);
  const variable = exp.reduce((a,e)=>a+e.amount,0);
  const spent = t.m + t.reserve + variable;
  const left = income - spent;

  const segs = [
    {name:'Monthly bills', amt:t.m, color:'var(--fixed)'},
    {name:'Put aside for yearly bills', amt:t.reserve, color:'var(--reserve)'},
    ...S.categories.filter(c=>byCat[c.id]).map(c=>({name:c.name, amt:byCat[c.id], color:c.color}))
  ];
  Object.keys(byCat).filter(id=>!S.categories.some(c=>c.id===id)).forEach(id=>segs.push({name:'Uncategorised',amt:byCat[id],color:'#888'}));
  const scale = Math.max(income, spent) || 1;
  const strip = segs.filter(s=>s.amt>0).map(s=>`<span style="flex-grow:${s.amt/scale};background:${s.color}" title="${esc(s.name)}"></span>`).join('')
              + (left>0 ? `<span class="free" style="flex-grow:${left/scale}"></span>` : '');
  const legend = segs.filter(s=>s.amt>0).map(s=>`<li><i style="background:${s.color}"></i><span>${esc(s.name)}</span><span class="amt num">${chf(s.amt)}</span><span class="of num">${income?Math.round(s.amt/income*100):0}%</span></li>`).join('')
              + `<li><i style="background:var(--free);outline:1px solid var(--line)"></i><span>Left over</span><span class="amt num">${chf(left)}</span><span class="of num">${income?Math.round(left/income*100):0}%</span></li>`;

  const catRows = S.categories.map(c=>{
    const s = byCat[c.id]||0;
    if(!c.budget && !s) return '';
    let right, pct, bad=false;
    if(c.budget){ pct=Math.min(100, s/c.budget*100); bad = s>c.budget;
      right = bad ? `${chf0(s-c.budget)} over` : `${chf0(c.budget-s)} left of ${chf0(c.budget)}`; }
    else { pct = variable? s/variable*100 : 0; right = 'no budget set'; }
    return `<div class="cat"><div class="top"><b>${esc(c.name)}</b><span class="num">${chf(s)}</span></div>
      <div class="bar"><span style="width:${pct}%;background:${bad?'var(--over)':c.color}"></span></div>
      <div class="top" style="margin-top:4px"><span></span><span class="r num ${bad?'bad':''}">${right}</span></div></div>`;
  }).join('');

  let list = '', lastDay='';
  exp.forEach(e=>{
    if(e.date!==lastDay){ lastDay=e.date; const d=new Date(e.date+'T00:00');
      list += `<div class="day">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div>`; }
    const c = catById(e.cat);
    list += `<button class="row" data-exp="${e.id}"><span class="dot" style="background:${c.color}"></span>
      <span class="t"><div>${esc(e.note||c.name)}</div>${e.note?`<div class="sub">${esc(c.name)}</div>`:''}</span>
      <span class="a num">${chf(e.amount)}</span></button>`;
  });

  const firstRun = !S.income.monthly && !S.fixed.length && !S.expenses.length;
  $('#view-month').innerHTML = `
    ${firstRun?`<div class="card" style="margin-bottom:14px"><b>Welcome</b><p class="hint" style="margin:6px 0 12px">Import your backup file, or enter your salary and fixed costs yourself.</p><div class="two"><button class="btn" id="fImp">Import backup</button><button class="btn ghost" id="fSet">Enter salary</button></div></div>`:''}
    <div class="monthbar">
      <button class="iconbtn" id="prevM" aria-label="Previous month">‹</button>
      <h1>${monthName(cur)}</h1>
      <button class="iconbtn" id="nextM" aria-label="Next month">›</button>
    </div>
    <div class="hero">
      <div class="label">Left over this month</div>
      <div class="big num ${left<0?'neg':''}">${chf(left)}</div>
      <div class="strip" role="img" aria-label="Where your ${chf(income)} salary goes">${strip}</div>
      ${left<0?`<div class="overflag">You’re ${chf(-left)} over your salary this month</div>`:''}
      <ul class="legend">${legend}</ul>
    </div>
    <h2>Spending by category</h2>
    <div class="cats">${catRows || '<div class="hint">Nothing spent yet this month.</div>'}</div>
    <h2>Expenses <span class="hint num">· ${exp.length} · ${chf(variable)}</span></h2>
    <div class="list">${list || '<div class="empty">No expenses yet. Tap + to add your first one.</div>'}</div>`;

  if(firstRun){ $('#fImp').onclick=()=>$('#importFile').click(); $('#fSet').onclick=()=>document.querySelector('[data-tab="settings"]').click(); }
  $('#prevM').onclick = ()=>{ cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1); renderMonth(); };
  $('#nextM').onclick = ()=>{ cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); renderMonth(); };
  document.querySelectorAll('[data-exp]').forEach(b=> b.onclick = ()=> expenseSheet(S.expenses.find(e=>e.id===b.dataset.exp)));
}

/* ---------- Fixed costs view ---------- */
function renderFixed(){
  const t = totals();
  const group = (freq, title, total, sub) => {
    const items = S.fixed.filter(f=>f.freq===freq).sort((a,b)=>b.amount-a.amount);
    return `<h2>${title}</h2><div class="list">
      ${items.map(f=>`<button class="row" data-fix="${f.id}"><span class="t"><div>${esc(f.name)}</div>${freq==='y'?`<div class="sub num">${chf(f.amount/12)} per month</div>`:''}</span><span class="a num">${chf(f.amount)}</span></button>`).join('') || '<div class="empty">None yet.</div>'}
      <div class="totals"><span>${sub}</span><span class="num">${chf(total)}</span></div></div>`;
  };
  const yearIncome = S.income.monthly * (S.income.thirteenth?13:12);
  $('#view-fixed').innerHTML = `
    <div class="monthbar"><h1>Fixed costs</h1><button class="btn" id="addFix">Add</button></div>
    <div class="card">
      <div class="label hint">Your fixed costs per month</div>
      <div style="font-size:2rem;font-weight:750" class="num">${chf(t.m + t.reserve)}</div>
      <div class="hint num">${chf(t.m)} bills + ${chf(t.reserve)} to put aside for yearly bills</div>
      <div class="hint num" style="margin-top:8px">Per year: ${chf(t.m*12 + t.y)} of ${chf(yearIncome)} income (${yearIncome?Math.round((t.m*12+t.y)/yearIncome*100):0}%)</div>
    </div>
    ${group('m','Monthly',t.m,'Total per month')}
    ${group('y','Yearly',t.y,'Total per year')}`;
  $('#addFix').onclick = ()=> fixedSheet(null);
  document.querySelectorAll('[data-fix]').forEach(b=> b.onclick = ()=> fixedSheet(S.fixed.find(f=>f.id===b.dataset.fix)));
}

/* ---------- Settings view ---------- */
function renderSettings(){
  const yearIncome = S.income.monthly * (S.income.thirteenth?13:12);
  $('#view-settings').innerHTML = `
    <div class="monthbar"><h1>Settings</h1></div>
    <div class="card">
      <div class="field"><label for="sal">Monthly net salary (CHF)</label>
        <input class="input num" id="sal" inputmode="decimal" value="${S.income.monthly}"></div>
      <label class="switch"><span>I get a 13th salary</span><input type="checkbox" id="thir" ${S.income.thirteenth?'checked':''}></label>
      <div class="hint num" style="margin-top:10px">Yearly net income: ${chf(yearIncome)}</div>
    </div>
    <h2>Categories and monthly budgets</h2>
    <div class="card">
      <div id="catList">${S.categories.map(c=>`
        <div class="catedit"><i style="background:${c.color}"></i>
          <input class="input" data-cname="${c.id}" value="${esc(c.name)}" aria-label="Category name">
          <input class="input num" data-cbud="${c.id}" inputmode="decimal" value="${c.budget||''}" placeholder="No limit" aria-label="Monthly budget">
          <button data-cdel="${c.id}" aria-label="Delete ${esc(c.name)}">✕</button></div>`).join('')}</div>
      <button class="btn ghost block" id="addCat" style="margin-top:6px">Add category</button>
      <div class="hint" style="margin-top:10px">Leave the budget empty if you don’t want a limit.</div>
    </div>
    <h2>Your data</h2>
    <div class="card">
      <p class="hint" style="margin-top:0">Everything is stored only on this phone. Nothing is sent anywhere. Export a backup now and then — clearing your browser data would erase it.</p>
      <div class="two"><button class="btn ghost" id="exp">Export backup</button><button class="btn ghost" id="imp">Import backup</button></div>
      <button class="btn danger block" id="wipe" style="margin-top:10px">Erase all data</button>
    </div>`;

  $('#sal').onchange = e => { const n=parseAmt(e.target.value); if(!isNaN(n)&&n>=0){ S.income.monthly=n; save(); renderSettings(); toast('Salary saved'); } };
  $('#thir').onchange = e => { S.income.thirteenth = e.target.checked; save(); renderSettings(); };
  document.querySelectorAll('[data-cname]').forEach(i=> i.onchange = ()=>{ const c=catById(i.dataset.cname); const v=i.value.trim(); if(v){c.name=v; save();} });
  document.querySelectorAll('[data-cbud]').forEach(i=> i.onchange = ()=>{ const c=catById(i.dataset.cbud); const n=parseAmt(i.value); c.budget = isNaN(n)?0:Math.max(0,n); save(); });
  document.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const id=b.dataset.cdel, used=S.expenses.filter(e=>e.cat===id).length;
    if(S.categories.length<=1){ toast('Keep at least one category'); return; }
    if(!confirm(used?`Delete this category? Its ${used} expense(s) will move to “${S.categories.find(c=>c.id!==id).name}”.`:'Delete this category?')) return;
    const target = S.categories.find(c=>c.id!==id).id;
    S.expenses.forEach(e=>{ if(e.cat===id) e.cat=target; });
    S.categories = S.categories.filter(c=>c.id!==id); save(); renderSettings(); });
  $('#addCat').onclick = ()=>{ S.categories.push({id:uid(),name:'New category',budget:0,color:COLORS[S.categories.length%COLORS.length]}); save(); renderSettings(); };
  $('#exp').onclick = exportData;
  $('#imp').onclick = ()=> $('#importFile').click();
  $('#wipe').onclick = ()=>{ if(confirm('Erase all expenses, fixed costs and settings? This can’t be undone.')){ S=defaults(); save(); renderSettings(); toast('All data erased'); } };
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'budget-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Backup exported');
  }catch(e){ toast('Export isn’t available here'); }
}
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.expenses) || !Array.isArray(d.fixed) || !Array.isArray(d.categories)) throw 0;
      if(!confirm('Replace all current data with this backup?')) return;
      S=d; save(); renderAll(); toast('Backup imported'); }
    catch(_){ toast('That file isn’t a budget backup'); } };
  r.readAsText(f); e.target.value='';
};

/* ---------- Sheets ---------- */
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); }
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
$('#scrim').onclick = closeSheet;

function expenseSheet(e){
  const isNew = !e;
  let cat = e ? e.cat : (S.categories[0]||{}).id;
  const defDate = (!isNew) ? e.date : (monthKey(cur)===todayISO().slice(0,7) ? todayISO() : monthKey(cur)+'-01');
  openSheet(`
    <h3>${isNew?'Add expense':'Edit expense'}</h3>
    <div class="field"><label for="eAmt">Amount (CHF)</label>
      <input class="input amount num" id="eAmt" inputmode="decimal" placeholder="0.00" value="${e?e.amount:''}"></div>
    <div class="field"><label>Category</label><div class="chips" id="eCats">
      ${S.categories.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${c.id===cat}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div></div>
    <div class="two">
      <div class="field"><label for="eDate">Date</label><input class="input" type="date" id="eDate" value="${defDate}"></div>
      <div class="field"><label for="eNote">Note</label><input class="input" id="eNote" placeholder="Optional" value="${e?esc(e.note||''):''}"></div>
    </div>
    <div class="actions">${isNew?'':'<button class="btn danger" id="eDel">Delete</button>'}<button class="btn" id="eSave">${isNew?'Add expense':'Save changes'}</button></div>`);
  document.querySelectorAll('#eCats .chip').forEach(b=> b.onclick = ()=>{ cat=b.dataset.c; document.querySelectorAll('#eCats .chip').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  if(isNew) setTimeout(()=>$('#eAmt').focus(), 260);
  $('#eSave').onclick = ()=>{
    const amt = parseAmt($('#eAmt').value), date=$('#eDate').value;
    if(isNaN(amt)||amt<=0){ toast('Enter an amount above 0'); $('#eAmt').focus(); return; }
    if(!date){ toast('Pick a date'); return; }
    const note = $('#eNote').value.trim();
    if(isNew) S.expenses.push({id:uid(),date,amount:amt,cat,note});
    else Object.assign(e,{date,amount:amt,cat,note});
    save(); closeSheet(); renderMonth(); toast(isNew?'Expense added':'Changes saved');
  };
  if(!isNew) $('#eDel').onclick = ()=>{ S.expenses = S.expenses.filter(x=>x!==e); save(); closeSheet(); renderMonth(); toast('Expense deleted'); };
}

function fixedSheet(f){
  const isNew = !f; let freq = f ? f.freq : 'm';
  openSheet(`
    <h3>${isNew?'Add fixed cost':'Edit fixed cost'}</h3>
    <div class="field"><label for="fName">Name</label><input class="input" id="fName" value="${f?esc(f.name):''}" placeholder="e.g. Gym"></div>
    <div class="field"><label for="fAmt">Amount (CHF)</label><input class="input amount num" id="fAmt" inputmode="decimal" value="${f?f.amount:''}" placeholder="0.00"></div>
    <div class="field"><label>How often</label><div class="seg" id="fFreq">
      <button data-f="m" aria-pressed="${freq==='m'}">Every month</button><button data-f="y" aria-pressed="${freq==='y'}">Once a year</button></div></div>
    <div class="actions">${isNew?'':'<button class="btn danger" id="fDel">Delete</button>'}<button class="btn" id="fSave">${isNew?'Add fixed cost':'Save changes'}</button></div>`);
  document.querySelectorAll('#fFreq button').forEach(b=> b.onclick = ()=>{ freq=b.dataset.f; document.querySelectorAll('#fFreq button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  $('#fSave').onclick = ()=>{
    const name=$('#fName').value.trim(), amt=parseAmt($('#fAmt').value);
    if(!name){ toast('Give it a name'); return; }
    if(isNaN(amt)||amt<0){ toast('Enter a valid amount'); return; }
    if(isNew) S.fixed.push({id:uid(),name,amount:amt,freq}); else Object.assign(f,{name,amount:amt,freq});
    save(); closeSheet(); renderFixed(); toast(isNew?'Fixed cost added':'Changes saved');
  };
  if(!isNew) $('#fDel').onclick = ()=>{ S.fixed = S.fixed.filter(x=>x!==f); save(); closeSheet(); renderFixed(); toast('Fixed cost deleted'); };
}

/* ---------- misc ---------- */
let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }

let tab='month';
function renderAll(){ renderMonth(); renderFixed(); renderSettings(); }
document.querySelectorAll('nav.tabs button').forEach(b=> b.onclick = ()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  ['month','fixed','settings'].forEach(v=> $('#view-'+v).hidden = v!==tab);
  $('#fab').hidden = tab!=='month';
  if(tab==='month') renderMonth(); if(tab==='fixed') renderFixed(); if(tab==='settings') renderSettings();
  window.scrollTo(0,0);
});
$('#fab').onclick = ()=> expenseSheet(null);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

renderAll();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
</body>
</html>
